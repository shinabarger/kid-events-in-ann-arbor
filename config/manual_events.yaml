# Events with no feed anywhere. Facebook group posts, flyers, word of mouth.
#
# Only title and start are required. Times are Eastern, written as
# YYYY-MM-DDTHH:MM:SS-04:00 (use -05:00 between November and March).
#
# setting: indoor | outdoor | both
# cost:    free | paid
#
# Anything in here beats a scraped copy of the same event during dedupe, so
# this is also the place to correct a listing another site got wrong.

events: []

