# Venue lookup. Anything matched here gets exact coordinates, a city, and a
# drive time from downtown Ann Arbor (Main & Liberty). Everything else falls
# back to the estimate in scraper/geo.py.
#
# match: list of lowercase substrings. First venue with a hit wins, so put the
# more specific names above the general ones.
#
# drive_minutes: typical mid-day drive, not rush hour. Used for the
# "within about 29 minutes" filter.

origin:
  name: Downtown Ann Arbor
  lat: 42.2800
  lon: -83.7480

venues:
  - name: Little Break Cowork
    match:
      - little break
      - 3909 research park
    city: Ann Arbor
    address: 3909 Research Park Dr Suite 300, Ann Arbor, MI 48108
    lat: 42.2308
    lon: -83.7135
    drive_minutes: 11
    setting: indoor
    # Route 6 runs down Ellsworth to the Research Park office blocks.
    bus: true

